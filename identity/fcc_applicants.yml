# FCC applicant FRN -> Bus Benchmarks manufacturer cohort.
#
# The join rule for the pending-applications forward signal (methodology v1.7): a pending
# application lights up a manufacturer page ONLY when its applicant belongs to the same
# corporate group as the cohort, i.e. builder-operators who file for their own systems.
# Applicant is NOT builder in general: incumbent operators who buy their spacecraft
# (Intelsat, SES, EchoStar, Viasat, DIRECTV, SiriusXM, Telesat, Iridium, OneWeb...) are
# deliberately absent, as are operators whose builders are third parties (BlackSky/LeoStella,
# HawkEye 360/SFL, MethaneSAT/Ball, Loft/Airbus). Keyed on FRN (the FCC's stable org-level
# registration number) rather than name because the same org files under many legal names,
# and the same name recurs across unrelated legal entities.
#
# Slugs are validated against the live leaderboard at build time (scripts/build_rf.py);
# merge-retired slugs resolve through benchmark_slug_alias to the surviving cohort.

applicants:
