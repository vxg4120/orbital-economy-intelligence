[tool.pytest.ini_options]
markers = [
    "db: test requires a reachable DATABASE_URL",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

# The rule set is declared explicitly, and the version is pinned in requirements-dev.txt.
# Both halves matter: this repo went red in CI on 2026-08-11 without a single line of source
# changing, because requirements-dev.txt asked for an unpinned "ruff" and 0.16 shipped a wider
# default rule set than 0.15. An implicit rule set means the linter's meaning changes when the
# tool publishes, which is a gate that moves on its own. These are the rules the codebase is
# actually written against.
[tool.ruff.lint]
# This is ruff's pre-0.16 default set (E4/E7/E9 + F), which is what this code was written and
# reviewed against, plus I for import order. Widening the set is a deliberate cleanup with its own
# diff, not something to smuggle in while restoring a red build: adopting ruff 0.16's full default
# would mean ~100 unrelated edits (line lengths, datetime.UTC migration, comprehension rewrites)
# landing in a commit whose job is to make the gate honest again.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a function call in an argument default
# (db=Depends(get_db), q=Query(None)). That is the framework's documented interface, not the
# mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
    "Depends", "Query", "Path", "Body", "Header",
]
